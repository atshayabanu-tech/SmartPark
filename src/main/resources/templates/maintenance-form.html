<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: headContent('Maintenance Form')}"></head>
<body>
<nav th:replace="~{fragments :: navbar('maintenance')}"></nav>
<div th:replace="~{fragments :: alerts-banner}"></div>

<div class="container py-4">
    <div class="sp-page-header">
        <h2><i class="bi bi-tools me-2"></i><span th:text="${task.id == null} ? 'New Maintenance Task' : 'Edit Maintenance Task'">Task</span></h2>
    </div>

    <div class="card">
        <div class="card-body">
            <form th:action="${task.id == null} ? @{/maintenance/save} : @{/maintenance/{id}/update(id=${task.id})}"
                  th:object="${task}" method="post" class="row g-3">

                <div class="col-md-12">
                    <label class="form-label">Task Title *</label>
                    <input type="text" th:field="*{taskTitle}" class="form-control" th:errorclass="is-invalid"/>
                    <div class="invalid-feedback" th:errors="*{taskTitle}"></div>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Park *</label>
                    <select th:field="*{park.id}" class="form-select" required>
                        <option value="">-- Select park --</option>
                        <option th:each="p : ${parks}" th:value="${p.id}" th:text="${p.parkCode + ' - ' + p.parkName}"></option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Zone (optional)</label>
                    <select th:field="*{zone.id}" class="form-select">
                        <option value="">-- None --</option>
                        <option th:each="z : ${zones}" th:value="${z.id}" th:text="${z.zoneCode + ' - ' + z.zoneName}"></option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Category</label>
                    <select th:field="*{category}" class="form-select">
                        <option th:each="c : ${ {'GRASS_CUTTING','TREE_TRIMMING','CLEANING','WASTE_COLLECTION','BENCH_REPAIR','LIGHT_REPAIR','PLAYGROUND_REPAIR','PLANTING','GENERAL'} }"
                                th:value="${c}" th:text="${c}"></option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Priority</label>
                    <select th:field="*{priority}" class="form-select">
                        <option value="LOW">LOW</option>
                        <option value="MEDIUM">MEDIUM</option>
                        <option value="HIGH">HIGH</option>
                        <option value="CRITICAL">CRITICAL</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Status</label>
                    <select th:field="*{status}" class="form-select">
                        <option value="PENDING">PENDING</option>
                        <option value="IN_PROGRESS">IN_PROGRESS</option>
                        <option value="COMPLETED">COMPLETED</option>
                        <option value="OVERDUE">OVERDUE</option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Assigned To</label>
                    <input type="text" th:field="*{assignedTo}" class="form-control"/>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Scheduled Date *</label>
                    <input type="date" th:field="*{scheduledDate}" class="form-control" th:errorclass="is-invalid"/>
                    <div class="invalid-feedback" th:errors="*{scheduledDate}"></div>
                </div>
                <div class="col-12">
                    <label class="form-label">Description</label>
                    <textarea th:field="*{description}" class="form-control" rows="2"></textarea>
                </div>
                <div class="col-12">
                    <label class="form-label">Notes</label>
                    <textarea th:field="*{notes}" class="form-control" rows="2"></textarea>
                </div>
                <div class="col-12 d-flex gap-2">
                    <button type="submit" class="btn btn-sp-primary"><i class="bi bi-save me-1"></i>Save</button>
                    <a href="/maintenance" class="btn btn-outline-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>

<footer th:replace="~{fragments :: scripts}"></footer>
</body>
</html>
