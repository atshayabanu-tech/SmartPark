<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: headContent('Sensors')}"></head>
<body>
<nav th:replace="~{fragments :: navbar('sensors')}"></nav>
<div th:replace="~{fragments :: alerts-banner}"></div>

<div class="container-fluid py-4">
    <div class="sp-page-header">
        <h2><i class="bi bi-broadcast me-2"></i>Sensor Monitoring</h2>
        <p class="mb-0">Recent readings. Saving a reading updates the zone and raises alerts automatically.</p>
    </div>

    <div class="card mb-3">
        <div class="card-body">
            <h5 class="section-title">Add Manual Sensor Reading (demo)</h5>
            <form action="/sensors/save" th:object="${reading}" method="post" class="row g-2">
                <div class="col-md-3">
                    <label class="form-label">Zone *</label>
                    <select th:field="*{zone.id}" class="form-select" required>
                        <option value="">-- Select zone --</option>
                        <option th:each="z : ${zones}" th:value="${z.id}" th:text="${z.zoneCode + ' - ' + z.zoneName}"></option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label">Moisture (%)</label>
                    <input type="number" step="0.1" min="0" max="100" th:field="*{moistureLevel}" class="form-control" required/>
                </div>
                <div class="col-md-2">
                    <label class="form-label">Temp (°C)</label>
                    <input type="number" step="0.1" th:field="*{temperature}" class="form-control" required/>
                </div>
                <div class="col-md-2">
                    <label class="form-label">Humidity (%)</label>
                    <input type="number" step="0.1" min="0" max="100" th:field="*{humidity}" class="form-control"/>
                </div>
                <div class="col-md-2">
                    <label class="form-label">Rainfall (mm)</label>
                    <input type="number" step="0.1" min="0" th:field="*{rainfall}" class="form-control"/>
                </div>
                <div class="col-md-1 d-grid align-items-end">
                    <button type="submit" class="btn btn-sp-primary mt-4"><i class="bi bi-save"></i></button>
                </div>
            </form>
        </div>
    </div>

    <div class="card">
        <div class="card-body">
            <h5 class="section-title">Recent Readings</h5>
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                    <tr><th>Zone</th><th>Soil Moisture</th><th>Temperature</th><th>Humidity</th><th>Rainfall</th><th>Recorded</th><th>Status</th></tr>
                    </thead>
                    <tbody>
                    <tr th:each="r : ${readings}">
                        <td th:text="${r.zone.zoneCode + ' - ' + r.zone.zoneName}"></td>
                        <td th:text="${r.moistureLevel} + '%'"></td>
                        <td th:text="${r.temperature} + '°C'"></td>
                        <td th:text="${r.humidity} + '%'"></td>
                        <td th:text="${r.rainfall} + ' mm'"></td>
                        <td th:text="${#temporals.format(r.recordedAt, 'dd-MMM-yyyy HH:mm')}"></td>
                        <td>
                            <span th:if="${r.moistureLevel != null and r.zone.moistureThreshold != null and r.moistureLevel < r.zone.moistureThreshold}" class="badge bg-danger">LOW MOISTURE</span>
                            <span th:if="${r.temperature != null and r.temperature >= tempThreshold}" class="badge bg-warning text-dark">HIGH TEMP</span>
                            <span th:if="${r.rainfall != null and r.rainfall >= rainThreshold}" class="badge bg-info text-dark">HEAVY RAIN</span>
                            <span th:if="${(r.moistureLevel == null or r.zone.moistureThreshold == null or r.moistureLevel >= r.zone.moistureThreshold) and (r.temperature == null or r.temperature < tempThreshold) and (r.rainfall == null or r.rainfall < rainThreshold)}" class="badge bg-success">NORMAL</span>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(readings)}"><td colspan="7" class="text-center text-muted">No readings yet.</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{fragments :: scripts}"></footer>
</body>
</html>
