<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: headContent('Error')}"></head>
<body>
<nav th:replace="~{fragments :: navbar('')}"></nav>

<div class="container py-5">
    <div class="card text-center shadow-sm">
        <div class="card-body p-5">
            <i class="bi bi-exclamation-octagon text-danger" style="font-size:3rem;"></i>
            <h2 class="mt-3" th:text="${errorTitle != null} ? ${errorTitle} : 'Something Went Wrong'">Error</h2>
            <p class="text-muted" th:text="${errorMessage != null} ? ${errorMessage} : 'The page you requested could not be displayed.'">Message</p>
            <div class="mt-4 d-flex justify-content-center gap-2">
                <a href="/" class="btn btn-sp-primary"><i class="bi bi-house me-1"></i>Dashboard</a>
                <a href="javascript:history.back()" class="btn btn-outline-secondary">Go Back</a>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{fragments :: scripts}"></footer>
</body>
</html>
