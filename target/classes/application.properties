spring.application.name=SmartPark

server.port=8080

# MySQL database configuration
spring.datasource.url=jdbc:mysql://localhost:3306/smartpark?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=0216
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

spring.thymeleaf.cache=false

spring.mvc.hiddenmethod.filter.enabled=true

# Rule-based irrigation / alert thresholds (centralized in IrrigationThresholds)
park.threshold.rainfall=10.0
park.threshold.temperature=35.0
park.threshold.default-moisture=40.0
